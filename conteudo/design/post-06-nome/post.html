<!doctype html><html lang="pt"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--night:#062B45;--cyan:#28FFF8}
*{margin:0;box-sizing:border-box}body{background:#777;font-family:Inter}
.s{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 38%,#0B4468 0,#062B45 60%);color:#EAF3F8;display:flex;flex-direction:column;align-items:center;text-align:center}
.feed{width:1080px;height:1350px;padding-top:190px}.story{width:1080px;height:1920px;padding-top:330px}
.icon{height:400px}
.name{font:700 132px Lexend;margin-top:70px;letter-spacing:-1px}
.mean{font:500 64px Lexend;color:var(--cyan);margin-top:6px}
.lines{margin-top:70px;font:500 42px/1.55 Inter;color:#A9C2D3}.lines b{color:#fff;font-weight:600}
.cta{margin-top:70px;background:var(--cyan);color:var(--night);font:600 44px Lexend;padding:30px 54px;border-radius:999px}
.ring{position:absolute;border:3px solid rgba(40,255,248,.10);border-radius:50%}
</style></head><body>
<section class="s feed" id="feed">
<div class="ring" style="width:760px;height:760px;top:-30px"></div><div class="ring" style="width:1100px;height:1100px;top:-200px"></div>
<img class="icon" src="kipupu-icone-branco-hd.png">
<div class="name">KiPUPU</div><div class="mean">o que popou.</div>
<div class="lines"><b>Popar</b> tempo. <b>Popar</b> dinheiro.<br><b>Popar</b> a paciência da fila de sábado.</div>
<div class="cta">Comenta QUERO 👇</div>
</section>
<section class="s story" id="story">
<div class="ring" style="width:900px;height:900px;top:120px"></div><div class="ring" style="width:1300px;height:1300px;top:-80px"></div>
<img class="icon" src="kipupu-icone-branco-hd.png" style="height:460px">
<div class="name">KiPUPU</div><div class="mean">o que popou.</div>
<div class="lines"><b>Popar</b> tempo. <b>Popar</b> dinheiro.<br><b>Popar</b> a paciência da fila de sábado.</div>
<div class="cta">Brevemente em Luanda 💧</div>
</section></body></html>
